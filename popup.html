<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; width: 300px; padding: 15px; margin: 0; }
    h3 { margin-top: 0; color: #1e293b; font-size: 15px; }
    input { width: 92%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
    button { width: 100%; padding: 8px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    #result { margin-top: 12px; padding: 10px; border-radius: 4px; font-size: 12px; line-height: 1.6; display: none; }
    .safe { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .danger { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  </style>
</head>
<body>
  <h3>🛡️ Email & Link Threat Scanner</h3>
  <input type="text" id="userInput" placeholder="Sender email ya link dalo..." />
  <button id="checkBtn">Analyze Threat</button>
  <div id="result"></div>

  <script src="popup.js"></script>
</body>
</html>
